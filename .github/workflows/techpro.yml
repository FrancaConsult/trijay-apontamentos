name: Apontamentos diários Tech Pro
on:
  schedule:
    # 00:05 UTC = 21:05 do dia anterior em São Paulo.
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente conferir, sem cadastrar'
        type: boolean
        default: true
      from_date:
        description: 'Data inicial opcional (AAAA-MM-DD). Vazio: dia atual em São Paulo.'
        type: string
        required: false
      to_date:
        description: 'Data final opcional (AAAA-MM-DD). Vazio: igual à inicial.'
        type: string
        required: false
      resume_prepared:
        description: 'Retomar tentativa preparada após conferir o Tech Pro (um dia manual)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: techpro-timesheet
  cancel-in-progress: false
jobs:
  timesheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validar regras
        run: node --test tests/*.cjs
      - name: Conferir e cadastrar os apontamentos do dia
        env:
          TECHPRO_USERNAME: ${{ secrets.TECHPRO_USERNAME }}
          TECHPRO_PASSWORD: ${{ secrets.TECHPRO_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          TRIGGER_KIND: ${{ github.event_name }}
          MANUAL_FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.from_date || '' }}
          MANUAL_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.to_date || '' }}
          RESUME_PREPARED: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_prepared && 'true' || 'false' }}
        run: node automation/run.cjs
